<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terminal Text Cleaner</title>
<meta name="description" content="Free tool that cleans up text copied from a terminal: rejoins lines chopped mid-sentence and rebuilds numbered and bulleted lists. Runs entirely in your browser.">
<meta property="og:title" content="Terminal Text Cleaner">
<meta property="og:description" content="Paste text copied from a terminal and turn messy formatting clean. Rejoins wrapped lines, rebuilds lists, copies as rich text. Runs entirely in your browser.">
<meta property="og:type" content="website">
<style>
  :root {
    --neon: #CFFF00;
    --olive: #677B0E;
    --ink: #0A0A0F;
    --border: #d4d4d8;
    --bg: #fafafa;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Tool */
  main.wrap { flex: 1; width: 100%; max-width: 1120px; margin: 0 auto; padding: 32px 24px; }
  h1 { font-size: 23px; margin: 0 0 5px; }
  .sub { color: #71717a; font-size: 13px; margin: 0 0 22px; }
  .sub-quiet { color: #a1a1aa; }
  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 680px) { .panes { grid-template-columns: 1fr; } }
  .field {
    display: block; margin-bottom: 6px;
    font-size: 13px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; color: #3f3f46;
  }
  textarea, .preview {
    width: 100%;
    height: 360px;
    min-height: 180px;
    padding: 14px 16px;
    border: 2px solid var(--ink);
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.55;
    background: #fff;
    resize: vertical;
  }
  textarea {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
  }
  textarea:focus { outline: none; border-color: var(--olive); }
  .preview {
    overflow-y: auto;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .preview p { margin: 0 0 0.7em; }
  .preview ol, .preview ul { margin: 0 0 0.7em; padding-left: 1.7em; }
  .preview li { margin: 0 0 0.35em; padding-left: 0.2em; }
  .preview :last-child { margin-bottom: 0; }
  .preview .empty { color: #a1a1aa; }
  .preview pre.plain {
    margin: 0;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .actions { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .actions.split { justify-content: space-between; }
  button {
    font-size: 13px; font-weight: 600;
    padding: 9px 16px;
    border-radius: 8px;
    cursor: pointer;
    border: 1.5px solid var(--ink);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .primary { background: var(--neon); color: var(--ink); }
  .ghost {
    background: #fff; color: #71717a;
    border-color: var(--border);
  }
  .ghost:hover { color: var(--ink); border-color: #a1a1aa; }
  button:active { transform: translateY(1px); }
  button svg { display: block; }
  .seg {
    display: inline-flex;
    border: 1.5px solid var(--ink);
    border-radius: 8px;
    overflow: hidden;
  }
  .seg-btn {
    border: none; border-radius: 0;
    padding: 9px 16px;
    background: #fff;
    font-size: 13px; font-weight: 600;
    cursor: pointer;
  }
  .seg-btn + .seg-btn { border-left: 1.5px solid var(--ink); }
  .seg-btn.active { background: var(--neon); }
  .seg-btn:not(.active):hover { background: #f4f4f5; }

 
</style>
</head>
<body>

<main class="wrap">
  <h1>Terminal Text Cleaner</h1>
  <p class="sub">Paste text copied from a terminal and turn messy formatting clean. <span class="sub-quiet">Nothing you paste is captured or stored.</span></p>

  <div class="panes">
    <div>
      <span class="field">Terminal text</span>
      <textarea id="input" placeholder="Paste messy text here..." spellcheck="false"></textarea>
      <div class="actions">
        <button class="ghost" id="clearBtn"><span>Clear</span></button>
      </div>
    </div>
    <div>
      <span class="field">Clean text</span>
      <div class="preview" id="output"><span class="empty">Clean text appears here...</span></div>
      <div class="actions split">
        <div class="seg" id="seg">
          <button class="seg-btn active" data-fmt="rich">Rich text</button>
          <button class="seg-btn" data-fmt="plain">Plain text</button>
        </div>
        <button class="primary" id="copyBtn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          <span>Copy</span>
        </button>
      </div>
    </div>
  </div>
</main>


<script>
  const input = document.getElementById('input');
  const output = document.getElementById('output');
  const seg = document.getElementById('seg');

  let format = 'rich';
  let currentBlocks = [];

  // A line that starts a fresh block: numbered (1. 1)) or bulleted (- * •).
  const isListItem = s => /^(\d+[.)]|[-*•])\s/.test(s.trim());
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  // Strip a leading quote-gutter marker: the vertical bar terminals draw
  // down the left of quoted/blockquoted output (Claude Code uses ▎). Without
  // this the marker gets stranded mid-sentence when wrapped lines rejoin.
  const stripGutter = s => s.replace(/^\s*(?:[▏▎▍▌│┃]\s?)+/, '');

  // Squash the gap between two words down to a single plain space. Terminals
  // pad with far more than the space bar — tabs, non-breaking spaces, en/em and
  // ideographic spaces — and inline code copied out of a rendered view usually
  // arrives wrapped in them, which is what leaves a visible double space behind.
  // Matching "whitespace that isn't a line break" catches every variant rather
  // than only the ones we thought to list. Zero-width characters are deleted
  // outright: they render as nothing but still split words apart.
  const INVISIBLE = /[\u00AD\u034F\u200B-\u200D\u2060\uFEFF]/g;
  const HORIZONTAL_WS = /[^\S\r\n\u2028\u2029]+/g;
  const collapseSpaces = s => s.replace(INVISIBLE, '').replace(HORIZONTAL_WS, ' ');

  // Inline code copied out of a rendered view arrives padded with a space on
  // each side. Collapsing runs fixes the gap between words but leaves a stray
  // space hugging the inside of a bracket or sitting in front of punctuation.
  // The bracket rules skip genuinely empty pairs so markdown checkboxes ("[ ]")
  // survive, and punctuation only tightens when a space or the line end follows
  // it, which leaves emoticons like ":-)" and mid-sentence " ... " alone.
  const tightenPunctuation = s => s
    .replace(/([(\[{])\s+(?![)\]}])/g, '$1')
    .replace(/([^\s(\[{])\s+([)\]}])/g, '$1$2')
    .replace(/\s+([.,;:!?])(?=\s|$)/g, '$1');

  // Step 1: collapse terminal-wrapped lines back into logical lines.
  // Every line glues onto the one above it unless it's blank or starts a
  // new list item. Blank lines are kept (collapsed) as paragraph breaks.
  function toLogicalLines(text) {
    const raw = text.split(/\r\n|\r|\n|\u2028|\u2029/);
    let out = [];
    for (const line of raw) {
      const s = stripGutter(collapseSpaces(line)).trim();
      if (s === '') {
        if (out.length && out[out.length - 1] !== '') out.push('');
        continue;
      }
      const prev = out.length ? out[out.length - 1] : null;
      if (prev === null || prev === '' || isListItem(s)) out.push(s);
      else out[out.length - 1] = prev + ' ' + s;
    }
    while (out.length && out[0].trim() === '') out.shift();
    while (out.length && out[out.length - 1].trim() === '') out.pop();
    return out;
  }

  // Step 2: group logical lines into blocks (paragraphs + real lists).
  function toBlocks(lines) {
    const blocks = [];
    for (const line of lines) {
      const s = tightenPunctuation(line.trim());
      if (s === '') continue;
      const num = s.match(/^(\d+)[.)]\s+([\s\S]*)$/);
      const bul = s.match(/^[-*•]\s+([\s\S]*)$/);
      const last = blocks[blocks.length - 1];
      if (num) {
        if (last && last.type === 'ol') last.items.push({ n: num[1], t: num[2] });
        else blocks.push({ type: 'ol', items: [{ n: num[1], t: num[2] }] });
      } else if (bul) {
        if (last && last.type === 'ul') last.items.push({ t: bul[1] });
        else blocks.push({ type: 'ul', items: [{ t: bul[1] }] });
      } else {
        blocks.push({ type: 'p', text: s });
      }
    }
    return blocks;
  }

  function blocksToHtml(blocks) {
    return blocks.map(b => {
      if (b.type === 'p') return '<p>' + esc(b.text) + '</p>';
      if (b.type === 'ol') return '<ol>' + b.items.map(i =>
        '<li value="' + i.n + '">' + esc(i.t) + '</li>').join('') + '</ol>';
      return '<ul>' + b.items.map(i => '<li>' + esc(i.t) + '</li>').join('') + '</ul>';
    }).join('');
  }

  function blocksToPlain(blocks) {
    return blocks.map(b => {
      if (b.type === 'p') return b.text;
      if (b.type === 'ol') return b.items.map(i => i.n + '. ' + i.t).join('\n');
      return b.items.map(i => '• ' + i.t).join('\n');
    }).join('\n\n');
  }

  function render() {
    if (!currentBlocks.length) {
      output.innerHTML = '<span class="empty">Clean text appears here...</span>';
      return;
    }
    if (format === 'rich') {
      output.innerHTML = blocksToHtml(currentBlocks);
    } else {
      output.innerHTML = '<pre class="plain"></pre>';
      output.firstChild.textContent = blocksToPlain(currentBlocks);
    }
  }

  function process() {
    currentBlocks = input.value.trim()
      ? toBlocks(toLogicalLines(input.value)) : [];
    render();
  }

  input.addEventListener('input', process);

  // After a paste, snap back to the top so the input reads one-to-one
  // with the top of the clean-text box (rather than ending scrolled down).
  input.addEventListener('paste', () => {
    requestAnimationFrame(() => {
      input.setSelectionRange(0, 0);
      input.scrollTop = 0;
    });
  });

  seg.addEventListener('click', (e) => {
    const btn = e.target.closest('.seg-btn');
    if (!btn || btn.classList.contains('active')) return;
    seg.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    format = btn.dataset.fmt;
    render();
  });

  function flash(btn, msg) {
    const span = btn.querySelector('span');
    const orig = span.dataset.label || span.textContent;
    span.dataset.label = orig;
    span.textContent = msg;
    setTimeout(() => { span.textContent = orig; }, 1200);
  }

  document.getElementById('copyBtn').addEventListener('click', async (e) => {
    if (!currentBlocks.length) return;
    const btn = e.currentTarget;
    const plain = blocksToPlain(currentBlocks);
    if (format === 'rich') {
      try {
        await navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([blocksToHtml(currentBlocks)], { type: 'text/html' }),
          'text/plain': new Blob([plain], { type: 'text/plain' })
        })]);
        flash(btn, 'Copied');
      } catch (err) {
        await navigator.clipboard.writeText(plain);
        flash(btn, 'Copied as plain');
      }
    } else {
      await navigator.clipboard.writeText(plain);
      flash(btn, 'Copied');
    }
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    input.value = '';
    currentBlocks = [];
    render();
    input.focus();
  });

  // Keep both boxes the same height: resizing either one syncs the other.
  const ro = new ResizeObserver(entries => {
    for (const e of entries) {
      const h = Math.round(e.target.getBoundingClientRect().height);
      const other = e.target === input ? output : input;
      if (Math.abs(h - Math.round(other.getBoundingClientRect().height)) > 1) {
        other.style.height = h + 'px';
      }
    }
  });
  ro.observe(input);
  ro.observe(output);
</script>
</body>
</html>
